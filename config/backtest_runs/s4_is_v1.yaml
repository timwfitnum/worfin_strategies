# S4 Basis-Momentum — In-Sample Backtest v1
# Lock these parameters before running. Do NOT modify after first run.
# Reproducible via: python scripts/run_backtest.py --config config/backtest_runs/s4_is_v1.yaml

run_id: s4_is_v1
strategy: S4
period: IS
output_dir: runs/s4_is_v1

universe: [CA, AH, ZS, NI, PB, SN, GC, SI, PL, PA]  # all 10 metals

in_sample:
  start: 2008-01-02  # Data starts here; extend to 2005-01-01 when Nasdaq DataLink access restored
  end:   2017-12-31

out_of_sample: null   # OOS is a separate run after Plan 2 refactor
holdout: null

frequency: daily
bar_size: 1d
rebalance: biweekly   # every 10 trading days

capital_gbp: 100000   # £100k notional for IS run

target_vol_pct: 11          # annualised, strategy-level
vol_lookback_days: 60       # for vol targeting (20d primary, 60d robustness cap)
formation_window_months: 12 # kept for reference; implementation uses 60-day window
momentum_lookback_days: 60  # ln(P_t-5 / P_t-65)
momentum_skip_days: 5       # Jegadeesh-style skip to avoid short-term reversal
carry_weight: 0.50
momentum_weight: 0.50
interaction_weight: 0.25    # interaction term — amplifies signal agreement
zscore_clip: 2.0

costs:
  model: standard           # spread + commission + slippage from costs.py
  multiplier: 1.20          # COST_BASELINE_MULTIPLIER
  bps_overrides:
    NI: 12                  # Nickel: wider spread
    SN: 25                  # Tin: illiquid, conservative
  include_roll: true

fx_handling:
  base_currency: USD        # P&L in USD; GBP conversion at portfolio level only

seeds:
  numpy: 42                 # for any stochastic component

environment: backtest       # written to all DB rows (positions.trades, daily_pnl, etc.)
